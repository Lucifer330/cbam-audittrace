<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#111315">
    <title>CBAM-AuditTrace | Trace every CBAM number</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
    <script type="module" src="./src/app.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="#" data-page="dashboard" aria-label="CBAM-AuditTrace home">
          <span class="brand-mark"><span></span><span></span><span></span></span>
          <span class="brand-copy"><strong>AuditTrace</strong><small>CBAM WORKSPACE</small></span>
        </a>
        <div class="workspace-label">WORKSPACE</div>
        <nav class="primary-nav" aria-label="Main navigation">
          <button class="nav-link active" data-page="dashboard"><span class="nav-icon icon-grid">▦</span>Overview</button>
          <button class="nav-link" data-page="documents"><span class="nav-icon">▤</span>Documents<span class="nav-count" id="document-nav-count">0</span></button>
          <button class="nav-link" data-page="verification"><span class="nav-icon">✓</span>Verification</button>
          <button class="nav-link" data-page="calculations"><span class="nav-icon">∑</span>Calculations</button>
          <button class="nav-link" data-page="audit"><span class="nav-icon">◷</span>Audit trail</button>
          <button class="nav-link" data-page="rules"><span class="nav-icon">§</span>Rules</button>
          <button class="nav-link" data-page="reports"><span class="nav-icon">▧</span>Reports</button>
          <button class="nav-link" data-page="settings"><span class="nav-icon">⚙</span>Settings</button>
          <button class="nav-link" data-page="testing"><span class="nav-icon">✓</span>Testing</button>
        </nav>
        <div class="sidebar-bottom">
          <div class="support-card">
            <span class="support-icon">✓</span>
            <strong>Evidence, connected.</strong>
            <p>Every number linked to its source, review, and rule.</p>
          </div>
          <div class="profile-row">
            <span class="avatar">DA</span>
            <span class="profile-name"><strong>Demo auditor</strong><small>Local workspace</small></span>
            <span class="profile-menu">···</span>
          </div>
        </div>
      </aside>

      <main class="main-area">
        <header class="topbar">
          <div class="breadcrumb"><span>Workspace</span><span class="crumb-divider">/</span><strong id="breadcrumb-current">Overview</strong></div>
          <div class="topbar-actions">
            <span class="local-status"><i></i> All changes saved</span>
            <span class="demo-chip"><span></span> ILLUSTRATIVE DEMO</span>
            <button class="icon-button" aria-label="Help" title="Verify against current official CBAM guidance before compliance use.">?</button>
          </div>
        </header>
        <div id="app-content" class="page-content" aria-live="polite"></div>
      </main>
    </div>
    <div id="modal-root"></div>
    <div id="toast-root" class="toast-root" aria-live="polite"></div>
  </body>
</html>
